# Config do nginx para o site estático.
#
# - porta 8080: é a internal_port do fly.toml;
# - gzip para CSS, JS e SVG (o HTML o nginx já comprime por padrão);
# - cache curto no HTML, para uma troca de texto aparecer logo;
# - 404 de verdade para caminho inexistente, sem cair no index.html.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location = / {
        add_header Cache-Control "public, max-age=300";
        try_files /index.html =404;
    }

    location / {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
}
