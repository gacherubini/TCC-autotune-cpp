# Config do nginx para o site estático.
#
# - porta 8080: é a internal_port do fly.toml;
# - gzip só para texto (mp3 já é comprimido, gzip nele só gasta CPU);
# - cache curto no HTML, para uma troca de texto aparecer logo, e longo nos
#   mp3, que quase nunca mudam;
# - 404 de verdade para caminho inexistente, sem cair no index.html.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location = / {
        add_header Cache-Control "public, max-age=300";
        try_files /index.html =404;
    }

    location /audio/ {
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
}
