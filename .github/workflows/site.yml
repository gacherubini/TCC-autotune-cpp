# Publica a pasta site/ no GitHub Pages.
#
# Roda quando algo dentro de site/ chega na main, ou na mao (workflow_dispatch).
# Usa o caminho oficial do Pages por Actions: empacota a pasta como artefato e
# o deploy-pages publica. No repositorio, Settings > Pages precisa estar com a
# fonte "GitHub Actions".
name: Site

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

# Um deploy por vez; um novo push nao cancela o que ja esta publicando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
